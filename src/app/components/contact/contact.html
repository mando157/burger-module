<div class="content">
    <div class="title">
        <h2 class="text-center">BooK Now</h2>
    </div>
    <form action="" class="mx-3">
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">Name :</span>
            <input type="text" class="form-control" placeholder="Name" aria-label="Username"
                aria-describedby="basic-addon1">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">How many people :</span>
            <input type="number" class="form-control" placeholder="Number of people" aria-label="Username"
                aria-describedby="basic-addon1">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">Date :</span>
            <input type="datetime-local" class="form-control" aria-label="Username" aria-describedby="basic-addon1">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text">Message :</span>
            <textarea class="form-control" aria-label="With textarea"></textarea>
